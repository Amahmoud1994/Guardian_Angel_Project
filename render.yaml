# Render Blueprint — Dashboard → New → Blueprint → pick this repo.
# Creates the always-on web service plus a persistent Postgres database and wires them together.
# Values marked `sync: false` are secrets: Render asks for them during setup (never commit them).
services:
  - type: web
    name: guardian-angel
    runtime: python
    plan: starter            # always-on; the free plan sleeps and would stop the safety watchdog
    region: frankfurt        # pick the region closest to most of your users
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: guardian-angel-db
          property: connectionString
      # Your public address: https://guardianangel.at (used in email links + the Android app)
      - key: APP_BASE_URL
        sync: false
      # Email (Gmail: smtp.gmail.com / 587 + an App Password)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: FEEDBACK_EMAIL
        sync: false
      - key: OPERATOR_NAME
        sync: false
      # Comma-separated usernames allowed into the Monitor tab
      - key: ADMIN_USERNAMES
        sync: false
      # Keys — copy from your local vapid.json / case_key.json (see LAUNCH.md)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: CASE_FILE_ENCRYPTION_KEY
        sync: false
      # Android app (Trusted Web Activity) — filled in after PWABuilder packaging (see LAUNCH.md)
      - key: ANDROID_PACKAGE_NAME
        sync: false
      - key: ANDROID_CERT_SHA256
        sync: false
      # Optional error monitoring (sentry.io → project → Client Keys / DSN)
      - key: SENTRY_DSN
        sync: false

databases:
  - name: guardian-angel-db
    plan: basic-256mb        # paid plans keep data + backups; check current plan names in Render's pricing page
    region: frankfurt        # must match the web service region
    databaseName: guardian_angel
    user: guardian_angel
